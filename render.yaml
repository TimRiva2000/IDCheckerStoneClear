services:
  - type: web
    name: idv-ocr
    env: docker
    rootDir: idv-backend
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: MIN_AGE
        value: "18"
      - key: MAX_UPLOAD_BYTES
        value: "5242880"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: MOCK_VERIFIED
        value: "false"
