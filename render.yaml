services:
  - type: web
    name: idv-ocr
    env: docker
    rootDir: idv-backend
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: MIN_AGE
        value: "18"
      - key: OCR_ENGINE
        value: "paddle"
      - key: OCR_LANGS
        value: "eng"
      - key: OCR_MAX_DIM
        value: "1200"
      - key: MRZ_CROP_RATIO
        value: "0.35"
      - key: DOB_CROP_RATIO
        value: "0.55"
      - key: DEBUG_OCR
        value: "false"
      - key: MAX_UPLOAD_BYTES
        value: "5242880"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: MOCK_VERIFIED
        value: "false"
