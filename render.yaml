services:
  - type: web
    name: idv-drive-upload
    env: docker
    rootDir: idv-backend
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: MAX_UPLOAD_BYTES
        value: "52428800"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: DRIVE_FOLDER_ID
        value: ""
      - key: DRIVE_SERVICE_ACCOUNT_JSON_BASE64
        value: ""
      - key: DRIVE_SHARED_DRIVE
        value: "false"
      - key: DRIVE_PUBLIC
        value: "true"
      - key: DRIVE_FILENAME_PREFIX
        value: "id-upload"
